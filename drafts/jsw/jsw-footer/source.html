<!DOCTYPE html>
<html lang="en">
<head>
  <title>JSW Footer</title>
  <!-- the footer document itself has no header and no footer -->
  <meta name="nav" content="off">
  <meta name="footer" content="off">
</head>
<body>
  <!-- The JSW pages' footer document (/jsw-footer; design: migration-work/jsw-footer/design-footer.jpg).
       One section: the JSW Footer block (the wordmark, copyright, location, button, legal link and
       background), then its columns, each its own block with its links as children: Footer Links
       (title + links), Footer Social (title + networks). The links marked "placeholder" point to
       pages that don't exist yet; the social profiles are the networks' home pages until the
       real ones are known. The background is cut from the design screenshot (no asset was
       provided). -->
  <section class="jsw-footer-source">
    <img class="logo" src="/drafts/jsw-footer/jsw-motors-wordmark.png" alt="JSW Motors">
    <a class="logo-link" href="/sustainable-future">/sustainable-future</a>
    <p class="copyright">© 2026 JSW Motors</p>
    <p class="location">Mumbai, India</p>
    <a class="cta" href="/register-interest">REGISTER INTEREST</a>
    <a class="legal" href="/privacy-policy">PRIVACY POLICY</a> <!-- placeholder -->
    <img class="background" src="/drafts/jsw-footer/footer-bg.jpg" alt="">

    <div class="column links">
      <h2>TECHNOLOGY</h2>
      <a href="/nev-tech">NEVs</a>
      <a href="/nev-tech#pillars">Pillars</a> <!-- placeholder -->
      <a href="/nev-tech#benefits">Benefits</a> <!-- placeholder -->
    </div>
    <div class="column links">
      <h2>EXPLORE</h2>
      <a href="/about">About</a> <!-- placeholder -->
      <a href="/newsroom">Newsroom</a>
      <a href="/careers">Careers</a>
      <a href="/contact">Contact Us</a> <!-- placeholder -->
    </div>
    <div class="column social">
      <h2>CONNECT</h2>
      <a data-network="facebook" href="https://www.facebook.com/">Facebook</a>
      <a data-network="instagram" href="https://www.instagram.com/">Instagram</a>
      <a data-network="x" href="https://x.com/">X</a>
      <a data-network="linkedin" href="https://www.linkedin.com/">LinkedIn</a>
    </div>
  </section>
</body>
</html>
