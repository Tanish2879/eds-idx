<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reserved | JSW Motors</title>
  <meta name="description" content="Your JSW Motors reservation is confirmed. We'll message you when allocation opens.">
  <meta name="nav" content="/jsw-nav">
  <meta name="footer" content="off">
  <!-- the page this source becomes -->
  <meta name="target-path" content="/confirmation">
</head>
<body>
  <!-- Confirmation block, Variant A "Reserved" (design: migration-work/confirmation/design-variant-a.jpg).
       {firstName} / {email} are filled with the reservation's values (page address or the
       reservation form's data); {email|your inbox} falls back to "your inbox". -->
  <section class="confirmation-source" data-variant="variant-a">
    <p class="word">RESERVED</p>
    <h1>YOU’RE IN, {firstName}.</h1>
    <p class="description">We’ll message you when allocation opens. Your receipt is on its way to {email|your inbox}.</p>
    <img class="image" src="/drafts/confirmation/reserved-car.webp" alt="A JSW Motors SUV in silhouette">
    <img class="background" src="/drafts/confirmation/reserved-spotlight.jpg" alt="">
  </section>
</body>
</html>
