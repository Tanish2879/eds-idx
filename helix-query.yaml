version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
  blogs:
    include:
      - '/blogs/**'
    exclude:
      - '/**.json'
    target: /blog-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="article-date"], head > meta[name="publication-date"], head > meta[name="publishdate"], head > meta[name="date"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https://[^/]+(.*)")
      articleAuthor:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      isFeaturedBlog:
        select: head > meta[name="isfeaturedblog"]
        value: attribute(el, "content")
      tags:
        select: head > meta[name="cq-tags"]
        value: attribute(el, "content")
      publishDate:
        select: head > meta[name="published-time"]
        value: attribute(el, "content") 
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
  news:
    include:
      - '/newsroom/news/**'
    exclude:
      - '/**.json'
    target: /news-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="article-date"], head > meta[name="publication-date"], head > meta[name="publishdate"], head > meta[name="date"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https://[^/]+(.*)")
      articleAuthor:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      isFeaturedBlog:
        select: head > meta[name="isfeaturedblog"]
        value: attribute(el, "content")
      tags:
        select: head > meta[name="cq-tags"]
        value: attribute(el, "content")
      publishDate:
        select: head > meta[name="published-time"]
        value: attribute(el, "content") 
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")